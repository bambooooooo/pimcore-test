services:
    redis:
        image: redis:alpine
        command: [ redis-server, --maxmemory 128mb, --maxmemory-policy volatile-lru, --save "" ]

    rabbitmq:
        image: rabbitmq:alpine
        volumes:
            - pimcore-rabbitmq:/var/lib/rabbitmq/

    # innodb-strict-mode=0: the wide Product/ProductSet tables exceed InnoDB's worst-case row size estimate.
    # Pimcore 2026 adds foreign keys on class save, which rebuilds those tables - with strict mode the rebuild fails.
    db:
        image: mariadb:10.11
        working_dir: /application
        command: [ mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci, --innodb-file-per-table=1, --innodb-strict-mode=0 ]
        volumes:
            - pimcore-database:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore
        ports:
            - "3306:3306"
        healthcheck:
            # The service is considered healthy when:
            # - connection to pimcore db can be established, and
            # - we can run a simple SQL query.
            test: [ "CMD-SHELL", "mysql -h db -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SHOW TABLES;'" ]
            interval: 10s
            retries: 6
            start_period: 1m
            timeout: 3s

    # Throwaway database for automated tests (tmpfs - recreated on every container start).
    # Start with: docker compose --profile test up -d test_db
    test_db:
        image: mariadb:10.11
        profiles: [ test ]
        command: [ mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci, --innodb-file-per-table=1, --innodb-strict-mode=0 ]
        tmpfs:
            - /var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore_test
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore
        healthcheck:
            test: [ "CMD-SHELL", "mysql -h test_db -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1;'" ]
            interval: 3s
            retries: 20
            timeout: 3s

    nginx:
        image: nginx:stable-alpine
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html:ro
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        user: '1000:1000' # set to your uid:gid
        image: pimcore/pimcore:php8.4-debug-latest
        environment:
            APP_ENV: dev
            APP_DEBUG: 1
            PIMCORE_DEV_MODE: true
            COMPOSER_HOME: /var/www/html
            PHP_IDE_CONFIG: serverName=localhost
            PHP_MEMORY_LIMIT: 1024M
            PHP_MAX_EXECUTION_TIME: 90
            # Feed installer configuration via ENV variables.
            # See: https://pimcore.com/docs/pimcore/current/Development_Documentation/Getting_Started/Advanced_Installation_Topics.html#page_Advanced-Installation-Topics
            PIMCORE_INSTALL_MYSQL_USERNAME: pimcore
            PIMCORE_INSTALL_MYSQL_PASSWORD: pimcore
            PIMCORE_INSTALL_MYSQL_PORT: 3306
            PIMCORE_INSTALL_MYSQL_HOST_SOCKET: db
            PIMCORE_INSTALL_MYSQL_DATABASE: pimcore
            DOCTRINE_DEPRECATIONS: ignore
        depends_on:
            db:
                condition: service_healthy
            opensearch:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - ./.docker/messenger.yaml:/var/www/html/config/packages/messenger.yaml:ro
            - /mnt/projects/RENDERS:/var/www/html/renders:ro

    supervisord:
        user: '1000:1000' # set to your uid:gid
        image: pimcore/pimcore:php8.4-supervisord-latest
        environment:
            PHP_MEMORY_LIMIT: 4096M
        depends_on:
            rabbitmq:
                condition: service_started
            db:
                condition: service_healthy
            opensearch:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - ./.docker/messenger.yaml:/var/www/html/config/packages/messenger.yaml:ro
            - ./.docker/supervisord.conf:/etc/supervisor/conf.d/pimcore.conf:ro
            - /mnt/projects/RENDERS:/var/www/html/renders:ro

    # Search index for Pimcore Studio (generic-data-index-bundle)
    opensearch:
        image: opensearchproject/opensearch:2
        environment:
            - cluster.name=pimcore
            - node.name=opensearch
            - discovery.type=single-node
            - cluster.routing.allocation.disk.threshold_enabled=false
            - bootstrap.memory_lock=true
            - action.auto_create_index=false
            - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
            - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Pimcore!Search2026}
        ulimits:
            memlock: { soft: -1, hard: -1 }
            nofile: { soft: 65536, hard: 65536 }
        volumes:
            - pimcore-opensearch:/usr/share/opensearch/data
        healthcheck:
            test: [ "CMD-SHELL", "curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'" ]
            interval: 10s
            retries: 30
            start_period: 30s
            timeout: 5s

    # Real-time updates in Pimcore Studio, proxied by nginx under /hub
    mercure:
        image: dunglas/mercure
        restart: unless-stopped
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_KEY:-CHANGE_ME_THIS_IS_MY_SECRET_KEY_THAT_IS_LONG_ENOUGH_FOR_VALIDATION}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_KEY:-CHANGE_ME_THIS_IS_MY_SECRET_KEY_THAT_IS_LONG_ENOUGH_FOR_VALIDATION}
            MERCURE_EXTRA_DIRECTIVES: anonymous

    gotenberg:
        image: gotenberg/gotenberg:8
        command:
            - "gotenberg"
            - "--api-timeout=120s"
            - "--api-start-timeout=120s"
        ports:
            - "3000:3000"

volumes:
    pimcore-database:
    pimcore-rabbitmq:
    pimcore-opensearch:
