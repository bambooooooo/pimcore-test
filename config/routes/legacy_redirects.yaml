# Permanent redirects for URLs that moved. Shared links must never break (see tests/Support/Data/url_contract.yaml).
# Route names must start with "legacy_"; list every old URL under "redirects" in url_contract.yaml.
#
# legacy_old_price_list:
#     path: /object/{_locale}/{id}/pricelist
#     controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
#     defaults:
#         route: _price_list
#         permanent: true
#         keepQueryParams: true

# Classic admin UI (removed in Pimcore 2026) - bookmarks go to Pimcore Studio.
# Old deeplinks (/admin/login/deeplink?object_1_object) are handled by App\Controller\LegacyAdminController.
legacy_admin:
    path: /admin
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: pimcore_studioui_default_index
        permanent: true
        keepQueryParams: true

legacy_admin_login:
    path: /admin/login
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: pimcore_studioui_default_index
        permanent: true
        keepQueryParams: true
