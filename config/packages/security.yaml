security:
    providers:
        pimcore_admin:
            id: Pimcore\Security\User\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Pimcore WebDAV HTTP basic // DO NOT CHANGE!
        pimcore_webdav:
            pattern: ^/asset/webdav
            provider: pimcore_admin
            http_basic: ~

        pimcore_studio: "%pimcore_studio_backend.firewall_settings%"

        # Factory panel. Shares the session context with Pimcore Studio (pimcore_admin),
        # so one login is valid for both and #[ProtectedEndpoint] sees the same session.
        factory:
            pattern: ^/factory
            context: pimcore_admin
            provider: pimcore_admin
            user_checker: Pimcore\Security\User\UserChecker
            login_throttling:
                max_attempts: 3
                interval: '5 minutes'
            form_login:
                login_path: factory_login
                check_path: factory_login
                success_handler: App\Security\LoginSuccessHandler
                username_parameter: username
                password_parameter: password
                enable_csrf: true
            logout:
                path: factory_logout
                target: factory_login

    access_control:
        # Pimcore admin ACl  // DO NOT CHANGE!
        - { path: ^/asset/webdav, roles: ROLE_PIMCORE_USER }
        - {
            path: ^/pimcore-studio/api/(docs|docs/json|translations|user/reset-password|setting/admin/thumbnail)$,
            roles: PUBLIC_ACCESS,
        }
        - { path: ^/pimcore-studio/api, roles: ROLE_PIMCORE_USER }
        # Factory ACL
        - { path: ^/factory/login$, roles: PUBLIC_ACCESS }
        - { path: ^/factory, roles: ROLE_PIMCORE_USER }

    role_hierarchy:
        # Pimcore admin  // DO NOT CHANGE!
        ROLE_PIMCORE_ADMIN: [ROLE_PIMCORE_USER]
